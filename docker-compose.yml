services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hwalingo
      POSTGRES_USER: hwalingo
      POSTGRES_PASSWORD: hwalingo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwalingo -d hwalingo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
