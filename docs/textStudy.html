<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col bg-background">
<!-- TopAppBar (Web) -->
<header class="hidden md:flex bg-surface dark:bg-surface-dim items-center justify-start px-margin-mobile h-16 w-full docked full-width top-0 shadow-sm sticky z-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="language">language</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">HwaLingo</span>
</div>
<nav class="ml-10 flex gap-6">
<a class="flex items-center gap-1 text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity duration-200 font-label-lg font-bold" href="#">
<span class="material-symbols-outlined text-[18px]">menu_book</span>
                텍스트 학습
            </a>
<a class="flex items-center gap-1 text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity duration-200 font-label-lg" href="#">
<span class="material-symbols-outlined text-[18px]">bookmark</span>
                나만의 단어장 (0)
            </a>
<a class="flex items-center gap-1 text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity duration-200 font-label-lg" href="#">
<span class="material-symbols-outlined text-[18px]">auto_awesome</span>
                AI 스토리텔링
            </a>
</nav>
</header>
<!-- TopAppBar (Mobile) -->
<header class="flex md:hidden bg-surface dark:bg-surface-dim items-center justify-start px-margin-mobile h-16 w-full docked full-width top-0 sticky z-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="language">language</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed">HwaLingo</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-4xl mx-auto px-margin-mobile py-lg pb-32 md:pb-lg">
<!-- Input Card -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_20px_-4px_rgba(24,51,42,0.04)] ring-1 ring-surface-variant/50">
<div class="flex items-center justify-between mb-4">
<h1 class="font-headline-sm text-headline-sm text-on-surface">학습할 언어와 문구를 입력하세요</h1>
<div class="relative">
<select class="appearance-none bg-surface-container-low border border-outline-variant rounded-lg pl-3 pr-8 py-1.5 text-sm font-label-lg text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary cursor-pointer">
<option value="en">영어</option>
<option value="ko">한국어</option>
<option value="ja">일본어</option>
<option value="zh">중국어</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[20px]">expand_more</span>
</div>
</div>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-4 min-h-[160px] resize-y text-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors" placeholder="어떤 언어든 입력하면 선택한 목표 언어로 번역 및 분석해 드립니다."></textarea>
<div class="flex justify-end mt-4">
<button class="bg-primary hover:bg-primary/90 text-on-primary font-label-lg px-6 py-2.5 rounded-lg flex items-center gap-2 transition-colors duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-[20px]">auto_awesome</span>
                    AI 분석 시작
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface-container-lowest dark:bg-surface-dim/90 shadow-[0_-1px_10px_rgba(24,51,42,0.04)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 pb-safe">
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold hover:bg-primary/5 p-1 rounded-lg scale-95 active:scale-90 transition-all duration-150 w-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="menu_book" data-weight="fill" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="font-label-sm text-[10px] sm:text-label-sm truncate">문장분석</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-primary/5 p-1 rounded-lg scale-95 active:scale-90 transition-all duration-150 w-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="bookmark">bookmark</span>
<span class="font-label-sm text-[10px] sm:text-label-sm truncate">단어장</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-primary/5 p-1 rounded-lg scale-95 active:scale-90 transition-all duration-150 w-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="quiz">quiz</span>
<span class="font-label-sm text-[10px] sm:text-label-sm truncate">테스트</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-primary/5 p-1 rounded-lg scale-95 active:scale-90 transition-all duration-150 w-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-sm text-[10px] sm:text-label-sm truncate">스토리텔링</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:bg-primary/5 p-1 rounded-lg scale-95 active:scale-90 transition-all duration-150 w-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-[10px] sm:text-label-sm truncate">마이페이지</span>
</a>
</nav>
</body></html>
