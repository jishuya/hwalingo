<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>

                        "surface-container-highest": "#dce2f3",
                        "on-primary-fixed": "#00210b",
                        "on-secondary-container": "#4d685e",
                        "primary": "#006b32",
                        "tertiary": "#2e6746",
                        "on-secondary-fixed-variant": "#314c42",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Canvas -->
<main class="flex-1 flex flex-col justify-center px-margin-mobile py-xl w-full max-w-md mx-auto relative z-10">
<!-- Header / Logo -->
<div class="mb-xl flex flex-col items-center">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">language</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-center tracking-tight text-on-background">Language Master</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm text-center">Welcome back! Ready to learn?</p>
</div>
<!-- Login Form -->
<form class="space-y-lg w-full">
<div class="space-y-md">
<!-- Email Input -->
<div class="relative">
<label class="sr-only" for="email">Email Address</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-sm">visibility_off</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full py-3 px-4 bg-primary text-on-primary rounded-lg font-label-lg text-label-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-sm" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Links -->
<div class="mt-lg flex justify-between items-center px-sm">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Find Password?</a>
<a class="font-label-sm text-label-sm text-primary hover:opacity-80 transition-colors font-semibold" href="#">Sign Up</a>
</div>
<!-- Divider -->
<div class="relative my-xl flex items-center w-full">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-outline font-label-sm text-label-sm uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md w-full">
<button class="flex items-center justify-center gap-sm py-3 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<img alt="Google" class="w-5 h-5 grayscale opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8YnMx7TDqF3Cfch3j3F35yvDOYxNrcgX9EAN9T8ZhMcHPaPvJCJogpN4C8L3FIoFqjV-W5szkNGUJBhAixn84wLsmDuAglimNQ11qZ_d3FqP6etwcJvIrdSMKWlzy7yREDl7CqXRRSCjYVxUt7kQHYjDYqWT1l64Gz1pYdUXMRO9WYcT6oBnaf6mXhqv85fcnCBXpGx9h2reHKNvBT_BrS-pM1voDnd3fpBCW8J2bhFZsrjEJO9m76w"/>
<span class="font-label-lg text-label-lg text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-sm py-3 px-4 bg-[#FEE500] text-[#000000] rounded-lg hover:opacity-90 transition-colors active:scale-[0.98] border border-[#FEE500]">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<span class="font-label-lg text-label-lg">Kakao</span>
</button>
</div>
</main>
</body></html>
