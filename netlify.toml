[build]
  command = "npm run build -w frontend"
  publish = "frontend/dist"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/api/*"
  to = "https://api-hwalingo.usagain.work/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
